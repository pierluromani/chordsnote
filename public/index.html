<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Explicit solid background on root elements prevents iOS Safari / WebKit
         from falling back to a translucent progressive blur under the status bar. */
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #FAF8F6;
      }
      /* Keep overflow:hidden on #root rather than body so iOS Safari's viewport
         compositor does not glitch or blur the top status bar area. */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
        overflow: hidden;
        background-color: #FAF8F6;
      }
      #status-bar-fill {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: 6px;
        background-color: #FAF8F6;
        pointer-events: none;
        z-index: 9999;
      }
    </style>

    <!-- Icon Expo picks up on its own only covers the browser tab favicon —
         these cover "Add to Home Screen" on iOS and Android/desktop PWAs. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <meta name="theme-color" content="#FAF8F6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ChordsNote" />
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- Solid fixed top backing plate sampled by iOS Safari / WebKit status bar -->
    <div id="status-bar-fill" aria-hidden="true"></div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
